name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild: catch upstream breakage (base images, dependencies,
  # browser/driver updates) before it hits a real change.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  format:
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.21.0-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: crystal tool format --check

  # Runs on the Ubuntu runner rather than the Alpine container: it ships
  # Google Chrome and a matching chromedriver, needed by the LuckyFlow specs.
  specs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Point LuckyFlow at the runner's chromedriver
        run: echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: shards install
      # The asset manifest is read at compile time.
      - name: Build assets
        run: bun install --frozen-lockfile && bun run build
      - name: Run specs
        run: crystal spec

  lint:
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.21.0-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install git
        run: apk add --no-cache git
      # The tagged ameba release does not yet build on Crystal 1.21, so build
      # the current master, which does.
      - name: Build ameba
        run: |
          git clone --depth 1 https://github.com/crystal-ameba/ameba.git /ameba
          cd /ameba && shards build
      - name: Lint
        run: /ameba/bin/ameba

  # Incremental mutation testing: only the domain files touched by the PR, so
  # feedback stays fast. The domain is the pure logic worth gating; Lucky
  # actions, pages and Avram models are adapters covered by the other specs.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Point LuckyFlow at the runner's chromedriver
        run: echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: shards install && bun install --frozen-lockfile && bun run build
      # crytic is not a shard dependency (local dev uses a global binary), and
      # its tagged release pulls an ameba that doesn't build on Crystal 1.21,
      # so build crytic here with ameba pinned to master.
      - name: Build crytic
        run: |
          git clone --depth 1 --branch v9.0.0 https://github.com/hanneskaeufler/crytic.git /tmp/crytic
          cd /tmp/crytic
          printf 'dependencies:\n  ameba:\n    github: crystal-ameba/ameba\n    branch: master\n' > shard.override.yml
          shards install
          shards build
      - name: Mutate changed domain files
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep '^src/domain/.*\.cr$' || true)
          if [ -z "$changed" ]; then
            echo "No domain files changed — skipping mutation testing."
            exit 0
          fi
          status=0
          for file in $changed; do
            echo "::group::mutation $file"
            /tmp/crytic/bin/crytic test --subject "$file" --min-msi 90 || status=1
            echo "::endgroup::"
          done
          exit $status
