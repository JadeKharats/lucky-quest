# Lucky's macros (`needs x : T`, `column x : T`, `attribute x : T`, `param x : T`)
# look like useless type-declared assignments to ameba.
Lint/UselessAssign:
  ExcludeTypeDeclarations: true

# spec/setup holds Lucky's spec hooks, not specs. `Excluded` works on every
# ameba version (the rule's own option was renamed on master).
Lint/SpecFilename:
  Excluded:
    - spec/setup/**

Globs:
  - "**/*.cr"
  - "!lib"
  - "!bin"
