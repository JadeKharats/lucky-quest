# Reference deployment: PostgreSQL, a one-shot migration, then the app.
# `docker compose up` builds the image locally; once it is published you can
# drop the `build:` line and pull ghcr.io/jadekharats/lucky-quest instead.
#
# Put the secrets in a `.env` file next to this one (never commit it):
#   SECRET_KEY_BASE=   # openssl rand -base64 32
#   POSTGRES_PASSWORD= # openssl rand -hex 24 (hex: safe inside DATABASE_URL)
#   APP_DOMAIN=        # public URL, e.g. https://quest.example.com
#
# Create the (only) account once the stack is up:
#   docker compose run --rm -it --entrypoint /app/quest-tasks migrate users.create you@example.com
x-app-env: &app-env
  DATABASE_URL: postgres://quest:${POSTGRES_PASSWORD:?set it in .env}@db:5432/quest
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set it in .env}
  APP_DOMAIN: ${APP_DOMAIN:-http://localhost:3000}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: quest
    volumes:
      - quest-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quest", "-d", "quest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending migrations, then exits.
  migrate:
    build: .
    image: ghcr.io/jadekharats/lucky-quest:latest
    entrypoint: ["/app/quest-tasks", "db.migrate"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  quest:
    image: ghcr.io/jadekharats/lucky-quest:latest
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  quest-pg:
